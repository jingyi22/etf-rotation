name: Daily recommendation

on:
  schedule:
    - cron: "40 8 * * 1-5"   # 北京时间 16:40（UTC 08:40），收盘且新浪日线更新之后
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ETF data
        run: python scripts/fetch_data.py

      - name: Fix share-split jumps
        run: python scripts/clean.py

      - name: Build panel
        run: python scripts/universe.py

      - name: Recommend, score matured picks, validate models
        run: python scripts/track.py

      - name: Ledger is append-only
        run: python scripts/check_ledger.py

      - name: Backtest current model
        run: python scripts/score.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/ 页面 + track/ 推荐台账与模型状态；data/ 是 CI 内临时缓存（gitignored）
          git add docs track
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "Daily $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') CST"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
