name: Update signals

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 北京时间 16:30（UTC 08:30），收盘后
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ETF data (full rebuild in CI; local cache is gitignored)
        run: python scripts/fetch_data.py

      - name: Fix share-split jumps
        run: python scripts/clean.py

      - name: Build panel
        run: python scripts/universe.py

      - name: Backtest and signals
        run: python scripts/score.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交生成页面；data/ 是 CI 内的临时缓存（gitignored）
          git add -f docs
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "Update signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
